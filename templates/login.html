<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Contract analyzer</title>
  <style nonce="{{ csp_nonce }}">
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      max-width: 24rem;
      margin: 4rem auto;
      padding: 0 1.25rem;
      line-height: 1.55;
    }
    h1 { font-size: 1.3rem; }
    .card {
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 1.25rem;
    }
    label { font-weight: 600; display: block; margin: 0.75rem 0 0.35rem; }
    input[type="text"], input[type="password"] {
      display: block;
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #b0b0b0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #1f4e78;
      color: #fff;
      cursor: pointer;
    }
    .error {
      margin-top: 1rem;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      background: #fdecec;
      color: #a12626;
      font-size: 0.92rem;
    }
    footer { margin-top: 1.5rem; color: #888; font-size: 0.83rem; }
  </style>
</head>
<body>
  <h1>Contract analyzer</h1>
  <div class="card">
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('do_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username"
             autofocus required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <footer>Runs entirely on the organization's machine. Contract text never leaves it.</footer>
</body>
</html>
