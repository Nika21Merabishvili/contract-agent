<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contract analyzer</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1.25rem;
      line-height: 1.55;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    p.lead { margin-top: 0; color: #666; }
    .card {
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    label { font-weight: 600; display: block; margin-bottom: 0.5rem; }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 0.6rem;
      border: 1px dashed #b0b0b0;
      border-radius: 8px;
      box-sizing: border-box;
    }
    #file-list {
      list-style: none;
      margin: 0.75rem 0 0;
      padding: 0;
      font-size: 0.92rem;
      color: #555;
    }
    #file-list li {
      padding: 0.15rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    #file-list li .file-name {
      overflow-wrap: anywhere;
      min-width: 0;
    }
    #file-list li .file-name::before { content: "📄 "; }
    .remove-file {
      flex: none;
      margin-top: 0;
      padding: 0.1rem 0.5rem;
      font-size: 1rem;
      line-height: 1.4;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: #a12626;
      cursor: pointer;
    }
    .remove-file:hover:not(:disabled) { background: #fdecec; }
    .remove-file:disabled { color: #bbb; cursor: not-allowed; }
    #file-count {
      margin: 0.6rem 0 0;
      font-size: 0.85rem;
      color: #888;
    }
    button {
      margin-top: 1.1rem;
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #1f4e78;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #9aa7b3; cursor: not-allowed; }
    #stop {
      margin-left: 0.6rem;
      background: #a12626;
    }
    #stop:disabled { background: #d9a3a3; cursor: not-allowed; }
    #status {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      display: none;
      white-space: pre-wrap;
    }
    #status.show { display: block; }
    #status.working { background: #eef4fb; color: #1f4e78; }
    #status.error   { background: #fdecec; color: #a12626; }
    #status.done    { background: #eaf6ec; color: #1e6b30; }
    #status.partial { background: #fff6e5; color: #8a5a00; }
    #status.stopped { background: #f0f0f0; color: #555; }
    #status ul { margin: 0.5rem 0 0; padding-left: 1.3rem; }
    .spinner {
      display: inline-block;
      width: 0.9em; height: 0.9em;
      margin-right: 0.5em;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      vertical-align: -0.1em;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { margin-top: 2rem; color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Contract analyzer</h1>
  <p class="lead">
    Upload one or more service contracts (PDF). Each is analysed locally against
    Article 104 of the Georgian Tax Code, and you get back a single Excel
    workbook — one row per contract.
  </p>

  <div class="card">
    <form id="form">
      <label for="file">Contract PDF(s)</label>
      <input id="file" name="file" type="file" accept="application/pdf,.pdf" multiple required>
      <ul id="file-list"></ul>
      <p id="file-count"></p>
      <button id="submit" type="submit">Analyse &amp; download Excel</button>
      <button id="stop" type="button" hidden>Stop</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <footer>Runs entirely on this machine via Ollama. Nothing is uploaded to the cloud.</footer>

  <script>
    const form = document.getElementById("form");
    const fileInput = document.getElementById("file");
    const fileListEl = document.getElementById("file-list");
    const fileCountEl = document.getElementById("file-count");
    const button = document.getElementById("submit");
    const stopButton = document.getElementById("stop");
    const statusEl = document.getElementById("status");

    // The source of truth for "what will be submitted" once removal exists --
    // a native FileList (fileInput.files) can't have one item deleted from it.
    // fileInput.files is kept in sync (via syncInputFiles) purely so the
    // browser's own native file-input label doesn't show a stale count.
    let selectedFiles = [];
    let busy = false; // true while /analyze is in flight; gates removal and Stop

    function setStatus(kind, html) {
      statusEl.className = "show " + kind;
      statusEl.innerHTML = html;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function syncInputFiles() {
      const dt = new DataTransfer();
      selectedFiles.forEach((f) => dt.items.add(f));
      fileInput.files = dt.files;
    }

    function renderFileList() {
      fileListEl.innerHTML = selectedFiles.map((f, i) => `
        <li>
          <span class="file-name">${escapeHtml(f.name)}</span>
          <button type="button" class="remove-file" data-index="${i}"
                  aria-label="Remove ${escapeHtml(f.name)}" ${busy ? "disabled" : ""}>✕</button>
        </li>
      `).join("");
      fileCountEl.textContent = selectedFiles.length
        ? `${selectedFiles.length} file${selectedFiles.length === 1 ? "" : "s"} selected`
        : "";
    }

    fileInput.addEventListener("change", () => {
      selectedFiles = Array.from(fileInput.files);
      renderFileList();
    });

    fileListEl.addEventListener("click", (event) => {
      if (busy) return;
      const removeBtn = event.target.closest(".remove-file");
      if (!removeBtn) return;
      selectedFiles.splice(Number(removeBtn.dataset.index), 1);
      syncInputFiles();
      renderFileList();
    });

    stopButton.addEventListener("click", async () => {
      stopButton.disabled = true;
      stopButton.textContent = "Stopping…";
      try {
        await fetch("/cancel", { method: "POST" });
      } catch (_) {
        // The in-flight /analyze request just runs to completion instead of
        // stopping early -- not fatal, nothing else to do from here.
      }
    });

    function base64ToBlob(base64, mimeType) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mimeType });
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const files = selectedFiles;
      if (files.length === 0) {
        setStatus("error", "Please choose at least one PDF first.");
        return;
      }

      button.disabled = true;
      fileInput.disabled = true;
      busy = true;
      renderFileList(); // disables each remove button
      stopButton.hidden = false;
      stopButton.disabled = false;
      stopButton.textContent = "Stop";
      const n = files.length;
      const workingMessage = (n === 1
        ? "Analysing… this can take a minute."
        : `Analysing ${n} contracts… this can take a few minutes. Each one is read by the ` +
          "local model in its own turn, one after another.") +
        " A scanned PDF (no text layer) is read by OCR first, which adds a while per page.";
      setStatus("working", `<span class="spinner"></span>${workingMessage}`);

      try {
        const body = new FormData();
        for (const f of files) body.append("file", f);
        const response = await fetch("/analyze", { method: "POST", body });

        let data;
        try {
          data = await response.json();
        } catch (_) {
          setStatus("error", "The server sent back something unexpected. Please try again.");
          return;
        }

        if (!response.ok) {
          setStatus("error", data.error || "Something went wrong. Please try again.");
          return;
        }

        if (data.cancelled) {
          setStatus("stopped", data.message || "Analysis stopped.");
          return;
        }

        const blob = base64ToBlob(data.workbook_base64, XLSX_MIME);
        triggerDownload(blob, data.filename);

        const failed = data.failed || [];
        const succeeded = data.succeeded || [];
        const ocrRead = data.ocr || [];
        let message = `Downloaded ${escapeHtml(data.filename)} ` +
          `(${succeeded.length} of ${n} contract${n === 1 ? "" : "s"} analysed).`;
        if (ocrRead.length > 0) {
          // OCR'd values are machine-read from images, not copied from a text
          // layer -- the sheet flags the same rows, but say it here too, where
          // the user is actually looking.
          message += "<br>Read via OCR (scanned document — verify names, ID numbers, " +
            "amounts and dates against the original):" +
            "<ul>" +
            ocrRead.map((name) => `<li>${escapeHtml(name)}</li>`).join("") +
            "</ul>";
        }
        if (failed.length > 0) {
          message += "<br>The following could not be analysed and were left out:" +
            "<ul>" +
            failed.map((f) => `<li>${escapeHtml(f.name)} — ${escapeHtml(f.error)}</li>`).join("") +
            "</ul>";
          setStatus("partial", message);
        } else {
          setStatus(ocrRead.length > 0 ? "partial" : "done", message);
        }
      } catch (_) {
        setStatus("error", "Could not reach the server. Is it still running?");
      } finally {
        button.disabled = false;
        fileInput.disabled = false;
        busy = false;
        renderFileList(); // re-enables each remove button
        stopButton.hidden = true;
      }
    });
  </script>
</body>
</html>
